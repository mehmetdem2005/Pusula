version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      types:
        patterns: ["@types/*"]
      nest:
        patterns: ["@nestjs/*"]
      sentry:
        patterns: ["@sentry/*"]
      eslint:
        patterns: ["eslint*", "@typescript-eslint/*", "typescript-eslint"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

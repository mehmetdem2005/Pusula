name: 🐛 Bug raporu
description: Beklenmeyen bir davranış / hata bildir
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Güvenlik açığı bildirimi için bu form yerine `security@pusula.tr` adresini kullan.**

  - type: input
    id: surum
    attributes:
      label: Sürüm
      description: Pusula web / extension / API sürümü
      placeholder: "web 0.0.1, extension 0.0.1"
    validations:
      required: true

  - type: textarea
    id: ne-bekleniyordu
    attributes:
      label: Beklenen davranış
    validations:
      required: true

  - type: textarea
    id: ne-oldu
    attributes:
      label: Gerçekleşen davranış
    validations:
      required: true

  - type: textarea
    id: adimlar
    attributes:
      label: Yeniden üretim adımları
      value: |
        1. …
        2. …
        3. …

  - type: textarea
    id: log
    attributes:
      label: İlgili log / ekran görüntüsü
      render: text

  - type: input
    id: env
    attributes:
      label: Tarayıcı / OS
      placeholder: "Chrome 130 / macOS 14"

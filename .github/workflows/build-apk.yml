name: build-apk

# Manuel tetiklenir (Actions sekmesi > build-apk > Run workflow).
# Gerekli: repo Secrets'a EXPO_TOKEN ekli olmalı (expo.dev > Account > Access Tokens).
# APK, EAS bulutunda derlenir; indirme linki iş kayıtlarında ve expo.dev panelinde çıkar.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profili'
        type: choice
        default: preview
        options: [preview, development, production]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        working-directory: apps/mobile
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive

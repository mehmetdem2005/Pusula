<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pusula / KelepirAI — Android</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #f0ece3; font-family: 'Inter', 'Roboto', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  @keyframes kBlink { 0%, 80%, 100% { opacity: 0.2; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
  @keyframes kPulse { 0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.6); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="kelepir-art.jsx"></script>
<script type="text/babel" src="kelepir-screens.jsx"></script>
<script type="text/babel" src="kelepir-screens-2.jsx"></script>

<script type="text/babel">
const { useState } = React;

function App() {
  // Navigation just visualizes the flow on the canvas
  const noop = () => {};
  const goto = (id) => {
    const el = document.querySelector(`[data-artboard-id="${id}"]`);
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  };

  return (
    <DesignCanvas title="Pusula — Kelepir AI" subtitle="Android (Material 3) · 5 ekran">
      <DCSection id="flow" title="Ana akış" subtitle="Tap herhangi bir ekrana büyüt">
        <DCArtboard id="home"    label="01 · Ana Sayfa" width={432} height={912}>
          <HomeScreen
            onNav={(id) => goto(id)}
            onOpenMenu={() => goto('menu')}
            onOpenChat={() => goto('chat')}
            onOpenDetail={() => goto('detail')}
          />
        </DCArtboard>
        <DCArtboard id="list"    label="02 · Sıralama (en kelepir üstte)" width={432} height={912}>
          <RankingScreen
            onNav={(id) => goto(id)}
            onOpenDetail={() => goto('detail')}
          />
        </DCArtboard>
        <DCArtboard id="menu"    label="03 · Menü (Drawer)" width={432} height={912}>
          <MenuScreen onNav={(id) => goto(id)} onClose={() => goto('home')} />
        </DCArtboard>
        <DCArtboard id="chat"    label="04 · AI Chat Bot" width={432} height={912}>
          <ChatScreen onNav={(id) => goto(id)} onBack={() => goto('home')} />
        </DCArtboard>
        <DCArtboard id="detail"  label="05 · İlan & Skor" width={432} height={912}>
          <DetailScreen onNav={(id) => goto(id)} onBack={() => goto('home')} />
        </DCArtboard>
        <DCArtboard id="history" label="06 · Geçmiş Analizler" width={432} height={912}>
          <HistoryScreen onNav={(id) => goto(id)} onOpenDetail={() => goto('detail')} />
        </DCArtboard>
        <DCArtboard id="favorites" label="07 · Favoriler" width={432} height={912}>
          <FavoritesScreen onNav={(id) => goto(id)} onOpenDetail={() => goto('detail')} />
        </DCArtboard>
        <DCArtboard id="map" label="08 · Harita Görünümü" width={432} height={912}>
          <MapScreen onNav={(id) => goto(id)} onOpenDetail={() => goto('detail')} />
        </DCArtboard>
        <DCArtboard id="alarm" label="09 · Fiyat Alarmı" width={432} height={912}>
          <AlarmScreen onNav={(id) => goto(id)} onOpenDetail={() => goto('detail')} />
        </DCArtboard>
        <DCArtboard id="compare" label="10 · Karşılaştırma" width={432} height={912}>
          <CompareScreen onNav={(id) => goto(id)} onOpenDetail={() => goto('detail')} />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>

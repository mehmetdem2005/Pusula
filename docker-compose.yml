services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pusula
      POSTGRES_PASSWORD: pusula_dev
      POSTGRES_DB: pusula_dev
    ports:
      - '5432:5432'
    volumes:
      - pusula_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - pusula_redis:/data

volumes:
  pusula_pg:
  pusula_redis:
